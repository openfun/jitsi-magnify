;;
;; magnify package
;;
[metadata]
name = magnify
version = 0.1.0
description = An authentication and room management system for Jitsi built with Django/React
long_description = file:README.md
long_description_content_type = text/markdown
author = Open FUN (France Universite Numerique)
author_email = fun.dev@fun-mooc.fr
url = https://github.com/openfun/jitsi-magnify
license = MIT
keywords = Django, Django-CMS, Open edX
classifiers =
    Development Status :: 4 - Beta
    Framework :: Django
    Framework :: Django :: 4.1
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Natural Language :: English
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10

[options]
include_package_data = True
# When you install a new package, if you do not want our renovate bot checks
# updates for it, please add the exact name of the package within
# `matchPackageNames` (in the "ignored python dependencies" group) within
# renovate.json file at the root of this repository
install_requires =
    Django
    djangorestframework
    django-parler>=2.0.1
    django-redis>=4.11.0
    Brotli
    django-timezone-field>=5.1
    djangorestframework-simplejwt[crypto]
    drf-yasg<1.21.6
    PyJWT
    python-dateutil
    tzdata
    whitenoise
package_dir =
    =src
packages = find:
zip_safe = True

[options.extras_require]
dev =
    bandit==1.9.4
    black==26.5.1
    cssselect==1.5.0
    defer==1.0.4
    factory-boy==3.3.3
    flake8==7.3.0
    htmlmin==0.1.12
    ipdb==0.13.13
    ipython==9.17.0
    isort==9.0.1
    lxml==6.1.2
    mysqlclient==2.2.8
    msgpack==1.2.2
    pylint==4.0.8
    pylint-django==2.8.0
    pytest==9.1.1
    pytest-cov==7.1.0
    pytest-django==4.14.0
    responses==0.26.3
    time-machine==3.5.0
    pytz==2026.3.post1
ci =
    twine==7.0.0
sandbox =
    django-configurations==2.5.1
    django-cors-headers==4.9.0
    dockerflow==2026.3.4
    factory-boy==3.3.3
    gunicorn==26.2.0
    psycopg2-binary==2.9.12
    sentry-sdk==2.68.1

[options.packages.find]
where = src

[wheel]
universal = 1

;;
;; Third-party packages configuration
;;
[flake8]
max-line-length = 99
exclude =
    .git,
    .venv,
    build,
    venv,
    __pycache__,
    node_modules,
    */migrations/*

[isort]
known_django=django
known_magnify=magnify
include_trailing_comma=True
line_length=88
multi_line_output=3
sections=FUTURE,STDLIB,DJANGO,THIRDPARTY,MAGNIFY,FIRSTPARTY,LOCALFOLDER
skip_glob=src/frontend/node_modules/**/*,venv

[tool:pytest]
addopts = -v --cov-report term-missing
python_files =
    test_*.py
    tests.py
testpaths =
    tests
filterwarnings =
    ignore:::(?!(tests|magnify))
